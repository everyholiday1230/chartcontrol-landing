<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ChartControl AI — 로그인</title>
<!--
   ★★★★ 이 자리에는 디자인 시제품이 있었다. 2026-09-23 에 **리다이렉트로 바꿨다.**

     시제품(`auth-app.js` / `legal-app.js`)은 `fetch` 가 0건이어서 실제 API 에
     연결되지 않았다. 그런데 화면은 정상으로 보였다:

       · 로그인 폼이 실제 비밀번호를 받고 **아무 데도 보내지 않은 뒤**
         `#/2fa` 로 넘어갔다 — 로그인이 성공한 것처럼 보였다.
         제품이 아닌 도메인의 동작하지 않는 비밀번호 입력란은
         피싱 페이지와 구별되지 않는다.
       · 약관 본문이 실제로 동의를 받는 약관과 달랐다(11절 대 15절).
         공개된 약관이 두 벌이면 어느 쪽에 동의한 것인지 다툼이 된다.

     처음에는 `noindex` 만 넣어 검색 노출을 막았다. 그러나 **주소를 직접 입력하면
     여전히 가짜 폼이 보였다.** 색인 차단은 발견을 줄일 뿐 폼을 없애지 않는다.
     그래서 시제품을 이 브랜치에서 빼고 실제 앱으로 보낸다.

   ★ 디자인 원본은 지우지 않았다 — `design-prototypes` 브랜치에 그대로 있다.
     GitHub Pages 는 `main` 만 서비스하므로 그 브랜치는 공개되지 않는다.

         git checkout design-prototypes

   ★ 실제 API 에 연결하는 방법은 BEOMONNURI-Innovation 저장소의
     ChartControl/docs/HANDOFF-static-landing-site.md 에 적어 뒀다.

   ★★ `noindex` 를 남겨 둔다. 리다이렉트 경유지는 색인될 이유가 없다.
     `canonical` 은 넣지 않는다 — `noindex` 와 모순되는 신호다.
-->
<meta http-equiv="refresh" content="0; url=https://chartcontrol.onrender.com/index.html#/login">
<link rel="preconnect" href="https://chartcontrol.onrender.com">
<script>
  /* 자바스크립트가 있으면 즉시 보낸다. 이력에 이 페이지를 남기지 않도록 replace 를 쓴다. */
  window.location.replace('https://chartcontrol.onrender.com/index.html#/login');
</script>
<style>
  html,body{margin:0;height:100%;background:#0b0e13;color:#e7ebf3;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  a{color:#6ea8fe}
  p{max-width:34em}
</style>
</head>
<body>
<main>
  <!-- 자바스크립트와 메타 리프레시가 모두 막힌 경우를 위한 실제 링크. -->
  <p>
    ChartControl AI 로그인 페이지로 이동합니다.<br>
    자동으로 넘어가지 않으면 <a href="https://chartcontrol.onrender.com/index.html#/login">여기를 누르세요</a>.
  </p>
</main>
</body>
</html>
